version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: freelink
      POSTGRES_USER: freelink
      POSTGRES_PASSWORD: freelink
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: freelink
      MINIO_ROOT_PASSWORD: freelinksecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
